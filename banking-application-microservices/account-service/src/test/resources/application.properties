spring.datasource.url=jdbc:h2:mem:accountdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.mail.username=test@example.com
app.document-storage.path=target/test-documents
app.document-storage.max-file-size-bytes=5242880
admin.service.url=http://localhost:8089
