server:
  port: 8083

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:mysql://localhost:3306/admindb?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreplyinterbankinghub@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:myAdminSecretKeyForBankingAdminService123456789}
  expiration: ${JWT_EXPIRATION:3600000}

root:
  admin:
    username: ${ROOT_ADMIN_USERNAME:rootadmin}
    password: ${ROOT_ADMIN_PASSWORD:rootpass}